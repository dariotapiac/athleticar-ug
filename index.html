<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AthleticAR UG - Estación 1</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #panel {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      background: rgba(0,0,0,.78);
      color: white;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      z-index: 10;
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      margin: 5px;
      cursor: pointer;
    }
    #timer { font-size: 32px; font-weight: bold; margin: 8px 0; }
  </style>
</head>
<body>

<div id="panel">
  <h2>🏃 Estación 1: Sprint Challenge</h2>
  <p>Reto: corre 20 metros y regresa. Objetivo: menos de 20 segundos.</p>
  <div id="timer">00:00</div>
  <button onclick="startTimer()">Iniciar</button>
  <button onclick="resetTimer()">Reiniciar</button>
  <p><strong>Puntos:</strong> 100 XP si completas el reto.</p>
</div>

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
  <a-marker preset="hiro">
    <a-box position="0 0.5 0" material="color: orange;" depth="1" height="1" width="1"></a-box>
    <a-text value="Sprint Challenge\nCorre 20 metros" position="-1.4 1.5 0" rotation="-90 0 0" color="yellow" width="4"></a-text>
    <a-cylinder position="0 -0.05 0" radius="1.1" height="0.08" color="#2196F3"></a-cylinder>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

<script>
  let seconds = 0;
  let interval = null;

  function formatTime(sec) {
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function startTimer() {
    if (interval) return;
    interval = setInterval(() => {
      seconds++;
      document.getElementById('timer').innerText = formatTime(seconds);
    }, 1000);
  }

  function resetTimer() {
    clearInterval(interval);
    interval = null;
    seconds = 0;
    document.getElementById('timer').innerText = '00:00';
  }
</script>

</body>
</html>
